name: reproductor
description: "Reproductor de música desde varias cuentas de Google Drive"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  web: ^1.1.0
  app_links: ^6.3.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.4

flutter:
  uses-material-design: true
